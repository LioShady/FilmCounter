version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: filmcounter_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-go_film_counter}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - filmcounter_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-go_film_counter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: filmcounter_app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-go_film_counter}
    env_file:
      - .env
    networks:
      - filmcounter_network

volumes:
  postgres_data:

networks:
  filmcounter_network:
    driver: bridge